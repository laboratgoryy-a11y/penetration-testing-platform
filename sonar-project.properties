# SonarCloud Configuration for Penetration Testing Platform

# Project identification
sonar.projectKey=pentest-platform
sonar.organization=your-org
sonar.projectName=Penetration Testing Platform
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=src/__tests__
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/index.ts,**/types/**

# Code analysis
sonar.javascript.node.maxspace=4096

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2

# Rule: Cognitive Complexity of functions should not be too high
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

# Rule: Functions should not have too many parameters
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts
