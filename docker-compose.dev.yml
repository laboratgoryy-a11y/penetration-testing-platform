version: '3.8'

services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    container_name: pentest-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-penetration_testing_platform_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - pentest-dev-network

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: pentest-redis-dev
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - pentest-dev-network

  # Application (Development with hot reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pentest-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      API_VERSION: v1
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-penetration_testing_platform_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # JWT
      JWT_SECRET: dev_secret_key_not_for_production
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 7d
      
      # Encryption
      ENCRYPTION_KEY: dev_encryption_key_not_for_production
      
      # Session
      SESSION_TIMEOUT_MINUTES: 30
      SESSION_MAX_DURATION_HOURS: 8
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # Security
      MFA_ISSUER: PenetrationTestingPlatform
      FAILED_LOGIN_ATTEMPTS_LIMIT: 5
      
      # Data Retention
      PHISHING_DATA_RETENTION_DAYS: 30
      AUDIT_LOG_RETENTION_YEARS: 7
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - app_dev_data:/app/data
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    networks:
      - pentest-dev-network
    depends_on:
      - postgres
      - redis
    command: npm run dev

networks:
  pentest-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  app_dev_data:
    driver: local
