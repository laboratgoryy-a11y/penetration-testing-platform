<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار شامل لفحص IP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .test-section {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-section h2 {
            color: #64B5F6;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        button.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        
        button.warning {
            background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%);
        }
        
        .log-container {
            background: #1a1a1a;
            border-radius: 6px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 5px;
            margin-bottom: 3px;
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }
        
        .log-entry.error {
            border-left-color: #f44336;
            color: #ff6b6b;
        }
        
        .log-entry.warning {
            border-left-color: #ff9800;
            color: #ffd93d;
        }
        
        .log-entry.success {
            border-left-color: #4CAF50;
            color: #6bcf7f;
        }
        
        .log-entry.info {
            border-left-color: #2196F3;
            color: #64B5F6;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .status-badge.success {
            background: #4CAF50;
            color: white;
        }
        
        .status-badge.error {
            background: #f44336;
            color: white;
        }
        
        .status-badge.warning {
            background: #ff9800;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-network-wired"></i> اختبار شامل لفحص IP</h1>
        
        <!-- اختبارات التهيئة -->
        <div class="test-section">
            <h2><i class="fas fa-cog"></i> اختبارات التهيئة</h2>
            <div class="button-grid">
                <button onclick="testManagerExists()">
                    <i class="fas fa-check"></i> تحقق من المدير
                </button>
                <button onclick="testScanTypes()">
                    <i class="fas fa-list"></i> اختبر أنواع الفحص
                </button>
                <button onclick="testTimingTemplates()">
                    <i class="fas fa-clock"></i> اختبر قوالب التوقيت
                </button>
            </div>
        </div>
        
        <!-- اختبارات النموذج -->
        <div class="test-section">
            <h2><i class="fas fa-wpforms"></i> اختبارات النموذج</h2>
            <div class="button-grid">
                <button onclick="testShowForm()">
                    <i class="fas fa-eye"></i> عرض النموذج
                </button>
                <button onclick="testFormElements()">
                    <i class="fas fa-tasks"></i> فحص عناصر النموذج
                </button>
                <button onclick="testScanTypeSelect()">
                    <i class="fas fa-list-ul"></i> فحص قائمة نوع الفحص
                </button>
                <button onclick="testManualPopulate()" class="warning">
                    <i class="fas fa-wrench"></i> ملء يدوي
                </button>
                <button onclick="testReloadForm()" class="danger">
                    <i class="fas fa-redo"></i> إعادة تحميل
                </button>
            </div>
        </div>
        
        <!-- اختبارات API -->
        <div class="test-section">
            <h2><i class="fas fa-server"></i> اختبارات API</h2>
            <div class="button-grid">
                <button onclick="testServerConnection()">
                    <i class="fas fa-plug"></i> اختبر الاتصال
                </button>
                <button onclick="testAuthorizationsAPI()">
                    <i class="fas fa-key"></i> اختبر التصاريح
                </button>
                <button onclick="testIPScansAPI()">
                    <i class="fas fa-database"></i> اختبر فحوصات IP
                </button>
            </div>
        </div>
        
        <!-- السجلات -->
        <div class="test-section">
            <h2><i class="fas fa-terminal"></i> السجلات</h2>
            <button onclick="clearLogs()" class="danger" style="margin-bottom: 10px;">
                <i class="fas fa-trash"></i> مسح السجلات
            </button>
            <div id="logs" class="log-container">
                <div class="log-entry info">جاهز للاختبار...</div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ip-scanner-manager.js"></script>
    
    <script>
        let logCount = 0;
        
        function log(message, type = 'info') {
            logCount++;
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${logCount}] [${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}]`, message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            logCount = 0;
            log('تم مسح السجلات', 'info');
        }
        
        // ========== اختبارات التهيئة ==========
        
        function testManagerExists() {
            log('🔍 اختبار وجود المدير...', 'info');
            
            if (typeof IPScannerManager === 'undefined') {
                log('❌ IPScannerManager غير معرف!', 'error');
                return false;
            }
            log('✅ IPScannerManager معرف', 'success');
            
            if (!window.ipScannerManager) {
                log('⚠️ window.ipScannerManager غير موجود، جاري الإنشاء...', 'warning');
                window.ipScannerManager = new IPScannerManager();
            }
            log('✅ window.ipScannerManager موجود', 'success');
            
            return true;
        }
        
        function testScanTypes() {
            log('📋 اختبار أنواع الفحص...', 'info');
            
            if (!testManagerExists()) return;
            
            const scanTypes = window.ipScannerManager.scanTypes;
            log(`✅ عدد الأنواع: ${Object.keys(scanTypes).length}`, 'success');
            
            Object.entries(scanTypes).forEach(([key, value]) => {
                log(`  - ${key}: ${value}`, 'info');
            });
        }
        
        function testTimingTemplates() {
            log('⏱️ اختبار قوالب التوقيت...', 'info');
            
            if (!testManagerExists()) return;
            
            const templates = window.ipScannerManager.timingTemplates;
            log(`✅ عدد القوالب: ${Object.keys(templates).length}`, 'success');
            
            Object.entries(templates).forEach(([key, value]) => {
                log(`  - ${key}: ${value}`, 'info');
            });
        }
        
        // ========== اختبارات النموذج ==========
        
        function testShowForm() {
            log('📝 اختبار عرض النموذج...', 'info');
            
            if (!testManagerExists()) return;
            
            try {
                window.ipScannerManager.showNewScanForm();
                log('✅ تم استدعاء showNewScanForm()', 'success');
                
                setTimeout(() => {
                    testFormElements();
                }, 500);
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
            }
        }
        
        function testFormElements() {
            log('🔍 فحص عناصر النموذج...', 'info');
            
            const modal = document.getElementById('scan-modal');
            if (!modal) {
                log('❌ Modal غير موجود!', 'error');
                return;
            }
            log('✅ Modal موجود', 'success');
            
            const form = document.getElementById('ip-scan-form');
            if (!form) {
                log('❌ Form غير موجود!', 'error');
                return;
            }
            log('✅ Form موجود', 'success');
            
            const elements = [
                'target-type',
                'target-value',
                'authorization-id',
                'scan-type',
                'timing'
            ];
            
            elements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    log(`✅ ${id} موجود`, 'success');
                } else {
                    log(`❌ ${id} غير موجود!`, 'error');
                }
            });
        }
        
        function testScanTypeSelect() {
            log('📊 فحص قائمة نوع الفحص...', 'info');
            
            const select = document.getElementById('scan-type');
            if (!select) {
                log('❌ قائمة نوع الفحص غير موجودة!', 'error');
                return;
            }
            log('✅ قائمة نوع الفحص موجودة', 'success');
            
            log(`📊 عدد الخيارات: ${select.options.length}`, 'info');
            
            if (select.options.length === 0) {
                log('❌ القائمة فارغة!', 'error');
            } else {
                log('✅ القائمة تحتوي على خيارات:', 'success');
                for (let i = 0; i < select.options.length; i++) {
                    log(`  ${i + 1}. ${select.options[i].value} - ${select.options[i].text}`, 'info');
                }
            }
        }
        
        function testManualPopulate() {
            log('🔧 اختبار الملء اليدوي...', 'info');
            
            if (!testManagerExists()) return;
            
            const select = document.getElementById('scan-type');
            if (!select) {
                log('❌ قائمة نوع الفحص غير موجودة!', 'error');
                log('💡 قم بعرض النموذج أولاً', 'warning');
                return;
            }
            
            log('🔧 جاري الملء اليدوي...', 'info');
            window.ipScannerManager.populateScanTypeSelect(select);
            
            setTimeout(() => {
                testScanTypeSelect();
            }, 100);
        }
        
        function testReloadForm() {
            log('🔄 اختبار إعادة تحميل النموذج...', 'info');
            
            if (!testManagerExists()) return;
            
            window.ipScannerManager.reloadForm();
            log('✅ تم استدعاء reloadForm()', 'success');
            
            setTimeout(() => {
                testFormElements();
            }, 500);
        }
        
        // ========== اختبارات API ==========
        
        async function testServerConnection() {
            log('🌐 اختبار الاتصال بالخادم...', 'info');
            
            try {
                const response = await fetch('http://localhost:3001/api/v1/scans/web');
                if (response.ok) {
                    log('✅ الخادم متصل ويعمل', 'success');
                } else {
                    log(`⚠️ الخادم يعمل لكن هناك خطأ: ${response.status}`, 'warning');
                }
            } catch (error) {
                log(`❌ فشل الاتصال: ${error.message}`, 'error');
            }
        }
        
        async function testAuthorizationsAPI() {
            log('🔑 اختبار API التصاريح...', 'info');
            
            try {
                const response = await api.get('/authorizations');
                log(`✅ Response success: ${response.success}`, 'success');
                
                if (response.data && response.data.authorizations) {
                    log(`📊 عدد التصاريح: ${response.data.authorizations.length}`, 'info');
                }
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
            }
        }
        
        async function testIPScansAPI() {
            log('📡 اختبار API فحوصات IP...', 'info');
            
            try {
                const response = await api.get('/ip-scans');
                log(`✅ Response success: ${response.success}`, 'success');
                
                if (response.data && response.data.scans) {
                    log(`📊 عدد الفحوصات: ${response.data.scans.length}`, 'info');
                }
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
            }
        }
        
        // تهيئة تلقائية
        window.addEventListener('load', () => {
            log('🚀 تم تحميل الصفحة', 'success');
            testManagerExists();
        });
    </script>
</body>
</html>
