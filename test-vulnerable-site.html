<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>موقع اختبار الثغرات</title>
</head>
<body>
    <h1>موقع اختبار الثغرات الأمنية</h1>
    
    <h2>الصفحات:</h2>
    <ul>
        <li><a href="test-vulnerable-site.html">الصفحة الرئيسية</a></li>
        <li><a href="test-page-1.html">صفحة 1</a></li>
        <li><a href="test-page-2.html">صفحة 2</a></li>
        <li><a href="test-page-3.html">صفحة 3</a></li>
    </ul>

    <h2>نموذج اختبار SQL Injection:</h2>
    <form action="test-vulnerable-site.html" method="GET">
        <input type="text" name="id" placeholder="أدخل ID">
        <input type="text" name="username" placeholder="اسم المستخدم">
        <button type="submit">بحث</button>
    </form>

    <h2>نموذج اختبار XSS:</h2>
    <form action="test-vulnerable-site.html" method="GET">
        <input type="text" name="search" placeholder="بحث">
        <input type="text" name="comment" placeholder="تعليق">
        <button type="submit">إرسال</button>
    </form>

    <h2>روابط اختبار Directory Traversal:</h2>
    <ul>
        <li><a href="?file=document.pdf">تحميل ملف</a></li>
        <li><a href="?page=about">صفحة عن</a></li>
    </ul>

    <h2>روابط اختبار Open Redirect:</h2>
    <ul>
        <li><a href="?redirect=https://google.com">إعادة توجيه 1</a></li>
        <li><a href="?url=https://example.com">إعادة توجيه 2</a></li>
        <li><a href="?next=/dashboard">التالي</a></li>
    </ul>

    <script>
        // عرض المعاملات في URL
        const params = new URLSearchParams(window.location.search);
        if (params.toString()) {
            document.body.innerHTML += '<div style="background: #f0f0f0; padding: 20px; margin: 20px 0;">';
            document.body.innerHTML += '<h3>المعاملات المستلمة:</h3>';
            document.body.innerHTML += '<pre>' + JSON.stringify(Object.fromEntries(params), null, 2) + '</pre>';
            document.body.innerHTML += '</div>';
        }
    </script>
</body>
</html>
